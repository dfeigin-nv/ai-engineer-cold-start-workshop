# Workshop demo lanes, Qwen3-0.6B, ALL-1.3.0 images (no shim), for the `workshop` vcluster (default ns).
#
# Adapted from autoscale-poc-nscale's chart templates, with two changes:
#   - No KEDA. `scalingAdapter` is dropped and replicas are explicit, so the
#     demo fires by patching replicas 1 -> 2 on cue. Deterministic stage timing.
#   - namespace `default` (where snapshot-pvc / shared-model-cache / ngc-secret
#     live inside the vcluster).
#
# Images stay on the dev-cbc8cac5 pins: the placeholder is restore-critical and
# has no 1.3.0 equivalent, and checkpointWorker MUST match placeholder exactly
# or nsrestore fails with "File X has bad size".
---
# Lane: fast-criu — checkpoint enabled, restores from a CRIU dump.
apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: vllm-fast-criu
  namespace: default
spec:
  services:
    Frontend:
      componentType: frontend
      replicas: 1
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          imagePullPolicy: IfNotPresent
        imagePullSecrets:
          - name: ngc-secret
    VllmWorker:
      componentType: worker
      replicas: 1
      checkpoint:
        enabled: true
        mode: Auto
        # Must match the worker args below exactly — the agent hashes this to
        # find the dump on disk. 0.6B passes --dtype bfloat16 explicitly, so
        # the identity records bfloat16 (not "auto").
        identity:
          model: "Qwen/Qwen3-0.6B"
          backendFramework: "vllm"
          tensorParallelSize: 1
          pipelineParallelSize: 1
          dtype: "bfloat16"
          maxModelLen: 2048
      resources:
        limits:
          gpu: "1"
          cpu: "32"
          memory: "64Gi"
        requests:
          cpu: "32"
          memory: "64Gi"
          custom:
            ephemeral-storage: "2Gi"
      extraPodSpec:
        runtimeClassName: nvidia
        nodeSelector:
          nvidia.com/gpu.present: "true"
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchExpressions:
                      - key: nvidia.com/dynamo-graph-deployment-name
                        operator: In
                        values: [vllm-fast-criu]
                      - key: nvidia.com/dynamo-component-type
                        operator: In
                        values: [worker]
        # torch/vLLM otherwise creates io_uring fds CRIU can't dump
        # ("Unknown shit ... anon_inode:[io_uring]"). Profile is placed on
        # each node by the snapshot-agent DaemonSet's initContainer.
        securityContext:
          seccompProfile:
            type: Localhost
            localhostProfile: profiles/block-iouring.json
        imagePullSecrets:
          - name: ngc-secret
        volumes:
          - name: shared-model-cache
            persistentVolumeClaim:
              claimName: shared-model-cache
              # NOT readOnly: ModelExpress writes missing manifest files into
              # the cache and crashes with EROFS on a read-only mount.
        mainContainer:
          image: nvcr.io/0980761089281446/dynamo-vllm-placeholder:1.3.0
          imagePullPolicy: IfNotPresent
          startupProbe:
            httpGet: { path: /live, port: system, scheme: HTTP }
            periodSeconds: 1
            timeoutSeconds: 2
            failureThreshold: 600
            successThreshold: 1
          readinessProbe:
            httpGet: { path: /health, port: system, scheme: HTTP }
            periodSeconds: 1
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet: { path: /live, port: system, scheme: HTTP }
            periodSeconds: 1
            timeoutSeconds: 2
            failureThreshold: 5
            successThreshold: 1
          command: [python3]
          args:
            - "-m"
            - "dynamo.vllm"
            - "--model"
            - "Qwen/Qwen3-0.6B"
            - "--dtype"
            - "bfloat16"
            - "--tensor-parallel-size"
            - "1"
            - "--max-model-len"
            - "2048"
            - "--max-num-seqs"
            - "2"
            - "--enable-sleep-mode"
          volumeMounts:
            - name: shared-model-cache
              mountPath: /models
          env:
            # vLLM's TCPStore binds whatever get_ip() returns; the pod IP is
            # invalid after restore onto a different node. 0.0.0.0 survives.
            - name: VLLM_HOST_IP
              value: "0.0.0.0"
            - name: HF_HOME
              value: /models
            - name: HF_HUB_OFFLINE
              value: "0"
---
# Lane: base — no checkpoint. Pays the full cold start; this is the contrast.
apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: vllm-base
  namespace: default
spec:
  services:
    Frontend:
      componentType: frontend
      replicas: 1
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          imagePullPolicy: IfNotPresent
        imagePullSecrets:
          - name: ngc-secret
    VllmWorker:
      componentType: worker
      replicas: 1
      resources:
        limits:
          gpu: "1"
          cpu: "32"
          memory: "64Gi"
        requests:
          cpu: "32"
          memory: "64Gi"
          custom:
            ephemeral-storage: "2Gi"
      extraPodSpec:
        runtimeClassName: nvidia
        nodeSelector:
          nvidia.com/gpu.present: "true"
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchExpressions:
                      - key: nvidia.com/dynamo-graph-deployment-name
                        operator: In
                        values: [vllm-base]
                      - key: nvidia.com/dynamo-component-type
                        operator: In
                        values: [worker]
        imagePullSecrets:
          - name: ngc-secret
        volumes:
          - name: shared-model-cache
            persistentVolumeClaim:
              claimName: shared-model-cache
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.3.0
          imagePullPolicy: IfNotPresent
          command: [python3]
          args:
            - "-m"
            - "dynamo.vllm"
            - "--model"
            - "Qwen/Qwen3-0.6B"
            - "--dtype"
            - "bfloat16"
            - "--tensor-parallel-size"
            - "1"
            - "--max-model-len"
            - "2048"
            - "--max-num-seqs"
            - "2"
          volumeMounts:
            - name: shared-model-cache
              mountPath: /models
          env:
            - name: HF_HOME
              value: /models
            - name: HF_HUB_OFFLINE
              value: "0"
