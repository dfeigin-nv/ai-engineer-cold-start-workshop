# snapshot-agent values for the workshop vcluster (dynamo 1.3.0 integrated path).
#
# Adapted from autoscale-poc-nscale/prep/snapshot-agent-values-fast-criu-nscale.yaml:
#   - image moved to the stock 1.3.0 release image (the poc used a
#     dev-cbc8cac5-aio custom build; today's earlier install wrongly used the
#     standalone-repo image ghcr.io/ai-dynamo/snapshot/agent, which belongs to
#     the other product line entirely)
#   - installs into the vcluster's `default` namespace, where snapshot-pvc lives
#
# seccomp.deploy=true: the workload's torch creates io_uring fds that CRIU
# cannot dump ("Unknown shit ... anon_inode:[io_uring]"). The initContainer
# copies block-iouring.json onto each node.

storage:
  type: pvc
  pvc:
    create: false
    name: snapshot-pvc

daemonset:
  image:
    repository: nvcr.io/nvidia/ai-dynamo/snapshot-agent
    tag: "1.3.0"
    pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ngc-secret
  nodeSelector:
    nvidia.com/gpu.present: "true"
  resources:
    requests:
      cpu: "10"
      memory: 1Gi
    limits:
      cpu: "127"
      memory: 256Gi

seccomp:
  deploy: true

config:
  criu:
    lazyPages: false
