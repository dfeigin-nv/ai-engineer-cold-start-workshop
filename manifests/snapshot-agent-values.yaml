# snapshot-agent values for the workshop vcluster (Dynamo 1.4.0).
#
# Installs into the vcluster's `default` namespace, where snapshot-pvc lives.
#
# seccomp.deploy=true: the workload's torch creates io_uring fds that CRIU
# cannot dump ("Unknown shit ... anon_inode:[io_uring]"). The initContainer
# copies block-iouring.json onto each node.

storage:
  type: pvc
  pvc:
    create: false
    name: snapshot-pvc

daemonset:
  image:
    repository: nvcr.io/nvidia/ai-dynamo/snapshot-agent
    tag: "1.4.0"
    pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ngc-secret
  nodeSelector:
    nvidia.com/gpu.present: "true"
  resources:
    requests:
      cpu: "10"
      memory: 1Gi
    limits:
      cpu: "127"
      memory: 256Gi

seccomp:
  deploy: true

config:
  criu:
    lazyPages: false
    imageIoMode: direct
